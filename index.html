<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="https://blogger.googleusercontent.com/img/a/AVvXsEjWypgdglgWhsUiuy2VwlqJFqHX2OoqfnqL183BK3oyatRhOB8tGX2cfKBzNgdwGa0J4s_Vbe8mbm3mmHCCOna2qGAZoP_czDXEksJvA7lP3BtZP2Qh79J_WU-2rk6vxM-zks60JRyBepAeUYEQ6drsFQbSucGvSOFOA83h9Sl-ljdN5THPZmUEY6rCbVa3" type="image/x-icon">
  <title>IPKDS - Sistema POS</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a"> 
  <link rel="apple-touch-icon" href="https://blogger.googleusercontent.com/img/a/AVvXsEjyMHY36o9HuL0SQ-anhzMhhS2IsZAFVENut4E1oTID-E-pgTVPHgmttQh5eknsP25Bu5CNsLDE3ZE5f0F3f3zdvo95aP3aOP4qPV0Fmq_v-nlrTxBtCVJIhxg1UbHW2vr0QbMCp8YSY1CW1cXwFFZ9p1Ny6PowjYDfp1ygV73gCGW0CYgc1111vVBF2uPn">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
      background-color: #0f172a; /* Fondo base del KDS */
    }
    iframe { 
      border: none; 
      width: 100%; 
      height: 100%; 
      display: block; 
    }

    /* Botón flotante al estilo IPKDS */
    #btn-instalar {
      display: none; 
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #8b5cf6; /* Morado Interplanet */
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
      z-index: 9999; 
      cursor: pointer;
      align-items: center;
      gap: 10px;
    }
    #btn-instalar:active {
      transform: translateX(-50%) scale(0.95);
    }
  </style>
</head>
<body>

  <button id="btn-instalar">
    <i class="fa-solid fa-download"></i> Instalar IPKDS
  </button>

  <iframe id="app-frame" allowfullscreen></iframe>

  <script>
    // 1. LÓGICA PARA LEER LA URL Y PASÁRSELA A GOOGLE SCRIPT
    const urlBase = "https://script.google.com/macros/s/AKfycbxdE5ktjmXQPDBmjtdCQzcDet0qpxpORUBXVXnoXhmX5e-QjDte8BgYglOJOBBzFiqIyA/exec";
    const parametros = window.location.search; // Esto captura el "?view=menu" de la barra de direcciones
    
    // Le decimos al iframe que cargue la ruta base + lo que sea que el usuario haya escrito arriba
    document.getElementById("app-frame").src = urlBase + parametros;


    // 2. REGISTRO DEL SERVICE WORKER
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('ServiceWorker registrado con éxito:', registration.scope);
          })
          .catch(error => {
            console.log('Error al registrar el ServiceWorker:', error);
          });
      });
    }

    // 3. EVENTO DE INSTALACIÓN
    let eventoInstalacionDiferido;
    const btnInstalar = document.getElementById('btn-instalar');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); 
      eventoInstalacionDiferido = e; 
      btnInstalar.style.display = 'flex'; 
    });

    btnInstalar.addEventListener('click', async () => {
      btnInstalar.style.display = 'none'; 
      eventoInstalacionDiferido.prompt(); 
      const { outcome } = await eventoInstalacionDiferido.userChoice;
      eventoInstalacionDiferido = null;
    });

    window.addEventListener('appinstalled', () => {
      btnInstalar.style.display = 'none';
      eventoInstalacionDiferido = null;
    });
  </script>

</body>
</html>
